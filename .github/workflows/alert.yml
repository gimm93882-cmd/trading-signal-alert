name: 1H signal alert

on:
  schedule:
    # 10분마다.
    #
    # 1시간봉이니 매시 1회면 충분해 보이지만, GitHub 의 예약 실행은 무료 티어에서
    # 보장되지 않는다. 실측으로 9시간 연속 건너뛴 적이 있고 그 사이 BUY 3건을 놓쳤다.
    # 자주 걸어두면 그중 하나는 실행된다.
    #
    # 중복 알림은 나지 않는다. 새 확정봉이 없으면 즉시 종료하고,
    # state.json 이 마지막으로 처리한 봉을 기억한다.
    #
    # public 저장소라 Actions 사용 시간이 무제한이므로 이 빈도가 가능하다.
    # private 로 되돌린다면 월 2,000분 한도(작업당 1분 올림) 때문에 30분 주기가 상한이다.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행

concurrency:
  # 앞선 실행이 밀려서 겹치면 state.json 을 동시에 건드리게 된다. 한 번에 하나만.
  group: signal-alert
  cancel-in-progress: false

permissions:
  contents: write           # state.json 커밋용

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 외부 패키지를 쓰지 않으므로 설치 단계가 없다.
      - name: 테스트
        run: python -m unittest discover -s tests

      - name: 신호 확인 및 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m bot.main

      - name: state.json 저장
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "state.json 변경 없음"
          fi
